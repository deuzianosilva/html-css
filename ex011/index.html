<!DOCTYPE html>
<html lang="pt-br">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midias em HTML5</title>
    <script>
    var corpo = window.document.bory
    corpo.style.background = 'black'
    </script>
</head>
<body>
    <div>Iteraja</div>
    
    <h1>Imagem Dinâmica</h1>
    <p>Tente abrir esse site em vários  dispositivos diferentes ou simplesmente aumente e diminua o tamanho do seu navegdor. </p>
    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="imagem-flexivel">
    </picture>

    <h1>Reprodizindo audio</h1>
    <p>Vamos aprender a reproduzir audio em html5</p>
    <audio preload="metadata" controls autoplay loop>
        <source src="midia/guanacast-33.mp3" type="audio/mpeg">
        <source src="midia/guanacast-33.mp3" type="audio/ogg">
        <source src="midia/guanacast-33.mp3" type="image/wav">
        <p>Seu navegador não suporta áudio <a href="midia/guanacast-33.mp3" download="guanacast-33.mp3" type="audio/max-width"></a></p>
    </audio>
    


</body>
</html>
